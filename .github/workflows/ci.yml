name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-sqlite:
    name: Default test suite (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (from lock file)
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[postgres,crypto]"

      - name: Run full verification
        run: ./scripts/verify.sh

  test-postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ep_test
          POSTGRES_PASSWORD: ep_test_pw
          POSTGRES_DB: ep_governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (from lock file)
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[postgres,crypto]"

      - name: Run full test suite with PostgreSQL
        env:
          EP_TEST_DB_URL: postgresql://ep_test:ep_test_pw@localhost:5432/ep_governance_test
        run: ./scripts/verify.sh

  cli-smoke:
    name: CLI smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (from lock file)
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[postgres,crypto]"

      - name: Verify CLI commands exist
        run: |
          ep-governance --help
          ep-governance mark-uncertain --help
          ep-governance reconcile --help
          ep-governance expire --help
          ep-governance cancel --help
          ep-governance check --help
          ep-governance execute --help
          ep-governance status --help
          ep-governance audit --help
          ep-governance serve --help

  security-scan:
    name: Security scans (Bandit + dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and security tools (from lock file)
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[postgres,crypto]"
          pip install bandit pip-audit

      - name: Bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Check for actionable Bandit findings
        run: |
          # Fail on HIGH severity findings.
          # MEDIUM findings are reported but do not fail CI.
          # A baseline comparison for new MEDIUM findings is a future improvement.
          python3 -c "
          import json
          with open('bandit-report.json') as f:
              data = json.load(f)
          high_findings = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']
          medium_findings = [r for r in data.get('results', []) if r.get('issue_severity') == 'MEDIUM']
          if high_findings:
              for r in high_findings:
                  print(f\"  [HIGH] {r['filename']}:{r['line_number']} — {r['issue_text'][:80]}\")
              print(f'\n{len(high_findings)} HIGH findings — CI failed.')
              exit(1)
          if medium_findings:
              for r in medium_findings:
                  print(f\"  [MEDIUM] {r['filename']}:{r['line_number']} — {r['issue_text'][:80]}\")
              print(f'\n{len(medium_findings)} MEDIUM findings (reported, does not fail CI).')
          else:
              print('No HIGH Bandit findings. No MEDIUM findings.')
          "

      - name: Dependency audit
        run: pip-audit --strict