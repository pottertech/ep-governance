name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-sqlite:
    name: Default test suite (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[postgres,crypto,dev]"

      - name: Run tests
        run: pytest tests/ -q --tb=short

  test-postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ep_test
          POSTGRES_PASSWORD: ep_test_pw
          POSTGRES_DB: ep_governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[postgres,crypto,dev]"

      - name: Run full test suite with PostgreSQL
        env:
          EP_TEST_DB_URL: postgresql://ep_test:ep_test_pw@localhost:5432/ep_governance_test
        run: pytest tests/ -q --tb=short

  cli-smoke:
    name: CLI smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[postgres,crypto,dev]"

      - name: Verify CLI commands exist
        run: |
          ep-governance --help
          ep-governance mark-uncertain --help
          ep-governance reconcile --help
          ep-governance expire --help
          ep-governance cancel --help
          ep-governance check --help
          ep-governance execute --help
          ep-governance status --help
          ep-governance audit --help
          ep-governance serve --help

  security-scan:
    name: Security scans (Bandit + dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Check for actionable Bandit findings
        run: |
          # Fail on HIGH and CRITICAL findings only.
          # LOW and MEDIUM findings are reported but do not fail CI.
          python3 -c "
          import json
          with open('bandit-report.json') as f:
              data = json.load(f)
          high_critical = [r for r in data.get('results', []) if r.get('issue_severity') in ('HIGH', 'CRITICAL')]
          if high_critical:
              for r in high_critical:
                  print(f\"  [{r['issue_severity']}] {r['filename']}:{r['line_number']} — {r['issue_text'][:80]}\")
              print(f'\\n{len(high_critical)} HIGH/CRITICAL findings — CI failed.')
              exit(1)
          else:
              print('No HIGH/CRITICAL Bandit findings.')
          "

      - name: Dependency audit
        run: pip-audit --strict