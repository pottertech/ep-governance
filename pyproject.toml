[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ep-governance"
version = "0.1.0"
description = "Binding governance system for AI agents — persistent DAG, deterministic policies, governed execution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Kevin D. Potter", email = "skip.potter.va@gmail.com" },
]
keywords = ["governance", "ai-agents", "policy", "audit", "enforcement"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "typer>=0.12",
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "sqlglot>=23.0",
    "pynacl>=1.5",
    "mcp>=0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "asyncpg>=0.29"]
crypto = ["cryptography>=42.0"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.0",
    "docker-compose>=1.5",
]

[project.scripts]
ep-governance = "ep_governance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ep_governance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests requiring PostgreSQL",
    "property: property-based tests using Hypothesis",
    "concurrency: concurrency tests",
    "security: adversarial security tests",
    "contract: executable contract tests",
]